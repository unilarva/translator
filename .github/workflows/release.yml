name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  validate-minimum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          package-manager-cache: false
      - run: npm install --global npm@11.15.0 --ignore-scripts
      - run: npm ci
      - run: npm run validate

  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global npm@11.15.0 --ignore-scripts
      - name: Check release identity
        run: |
          test "$(node -p 'require("./package.json").name')" = '@unilarva/translator'
          test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - run: npm ci
      - name: Validate and retain candidate
        run: |
          mkdir "$RUNNER_TEMP/candidate"
          npm pack --workspaces=false --pack-destination "$RUNNER_TEMP/candidate"
          cd "$RUNNER_TEMP/candidate"
          set -- *.tgz
          test "$#" -eq 1 && test -f "$1"
          sha256sum "$1" > "$1.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate
          path: |
            ${{ runner.temp }}/candidate/*.tgz
            ${{ runner.temp }}/candidate/*.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [validate-minimum, qualify]
    if: github.repository == 'unilarva/translator' && github.ref_protected && (vars.TRANSLATOR_PUBLISH_PROVIDER == '' || vars.TRANSLATOR_PUBLISH_PROVIDER == 'github')
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@unilarva/translator
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.15.0 --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate
          path: ${{ runner.temp }}/candidate
      - name: Verify and publish exact candidate
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          NPM_DIST_TAG: ${{ contains(github.ref_name, '-') && 'next' || 'latest' }}
        run: |
          node -e 'const [a,b]=require("child_process").execSync("npm --version").toString().trim().split(".").map(Number); if(a<11 || (a===11 && b<15)) throw new Error("Publishing requires npm >=11.15.0")'
          cd "$RUNNER_TEMP/candidate"
          set -- *.tgz
          test "$#" -eq 1 && test -f "$1"
          tarball="$1"
          set -- *.sha256
          test "$#" -eq 1 && test "$1" = "$tarball.sha256"
          sha256sum --check "$1"
          tar -xOf "$tarball" package/package.json | node -e 'const p=JSON.parse(require("fs").readFileSync(0,"utf8")); require("assert/strict").equal(p.name,"@unilarva/translator"); require("assert/strict").equal("v"+p.version,process.env.RELEASE_TAG)'
          npm publish "$tarball" --access public --provenance --tag "$NPM_DIST_TAG" --registry=https://registry.npmjs.org/
